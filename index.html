<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Portal</title>

<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #222;
}

button {
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
}


/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    background: #111111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 15px 45px rgba(0,0,0,.35);
}

.login-logo {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.yellow {
    color: #f4c400;
}

.login-subtitle {
    color: #666;
    margin-bottom: 28px;
}

.login-box label {
    display: block;
    font-weight: bold;
    margin-top: 17px;
    margin-bottom: 7px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 16px;
}

.login-button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #f4c400;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}


/* =========================
   PORTAL
========================= */

#portal {
    display: none;
    min-height: 100vh;
}

.topbar {
    background: #111111;
    color: white;
    min-height: 64px;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    white-space: nowrap;
}

.navigation {
    display: flex;
    gap: 5px;
    flex: 1;
    overflow-x: auto;
}

.navigation button {
    background: transparent;
    color: white;
    border: none;
    padding: 10px 12px;
    border-radius: 5px;
    white-space: nowrap;
}

.navigation button:hover,
.navigation button.active {
    background: #f4c400;
    color: #111;
}

.logout-button {
    background: #222;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 9px 13px;
    white-space: nowrap;
}


/* =========================
   MAIN
========================= */

#pageContent {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.page-title {
    margin-top: 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
    );
    gap: 18px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.course-card {
    border-top: 5px solid #f4c400;
}

.course-code {
    color: #777;
    font-weight: bold;
}

.course-title {
    margin-top: 7px;
}

.muted {
    color: #777;
}

.open-button {
    background: #111;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    margin-top: 8px;
}

.open-button:hover {
    background: #333;
}


/* =========================
   NOTICE
========================= */

.notice {
    background: #fff8d6;
    border-left: 5px solid #f4c400;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 20px;
}


/* =========================
   TABLES
========================= */

.table-container {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #111;
    color: white;
    padding: 14px;
    text-align: left;
}

td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}

.grade {
    font-weight: bold;
}

.not-graded {
    color: #777;
}


/* =========================
   COURSE TABS
========================= */

.course-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 18px 0;
}

.course-tabs button {
    background: white;
    border: 1px solid #ccc;
    padding: 9px 13px;
    border-radius: 6px;
}

.course-tabs button.active {
    background: #f4c400;
    border-color: #f4c400;
    font-weight: bold;
}


/* =========================
   LIST ITEMS
========================= */

.list-item {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

.list-item:last-child {
    border-bottom: none;
}


/* =========================
   MOBILE
========================= */

@media(max-width: 800px) {

    .topbar {
        flex-wrap: wrap;
        align-items: flex-start;
    }

    .navigation {
        width: 100%;
        order: 3;
    }

    #pageContent {
        padding: 16px;
    }

}

</style>
</head>

/* =====================================================
   SHOW PAGE
===================================================== */

function showPage(page) {

    const buttons =
        document.querySelectorAll(
            ".navigation button"
        );


    buttons.forEach(button => {

        button.classList.remove("active");

        if (
            button.dataset.page === page
        ) {
            button.classList.add("active");
        }

    });


    if (page === "dashboard") {
        showDashboard();
    }

    else if (page === "courses") {
        showCourses();
    }

    else if (page === "assignments") {
        showAssignments();
    }

    else if (page === "grades") {
        showGrades();
    }

    else if (page === "calendar") {
        showCalendar();
    }

    else if (page === "messages") {
        showMessages();
    }

    else if (page === "discussions") {
        showDiscussions();
    }

    else if (page === "profile") {
        showProfile();
    }

}

function showAssignments() {

    courses.forEach(course => {

                assignment[2] === null

                : "grade";


            rows += `

                <tr>

                    <td>
                        ${course.code}
                    </td>

                    <td>

                        <a
                            href="#"
                            onclick="
                                openAssignment(
                                    '${course.code}',
                                    '${assignment[1].replace(/'/g, "\\'")}'
                                );

                            "

                        </a>

                    </td>

                    <td>
                        ${assignment[0]}
                    </td>

                    <td class="${gradeClass}">
                        ${grade}

                </tr>

            `;

    });


    page.innerHTML = `

                            <td>
                                ${assignment[1]}
                            </td>

                            <td class="${
                                assignment[2] === null
                                ? "not-graded"
                                : "grade"
                            }">

                                ${
                                    assignment[2] === null
                                    ? "Not Graded"
                                    : assignment[2] + "%"
                                }

                            </td>

                        </tr>

                    `).join("")}

                </tbody>

            </table>

        </div>

    `;

}

/* =====================================================
   ASSIGNMENT DETAIL
===================================================== */

function openAssignment(
    courseCode,
    assignmentName
) {

    const course =
        courses.find(
            item =>
                item.code === courseCode
        );


    const assignment =
        course.assignments.find(
            item =>
                item[1] === assignmentName
        );


    const page =
        document.getElementById("pageContent");


    const gradeText =
        assignment[2] === null
        ? "Not Graded"
        : assignment[2] + "%";


    page.innerHTML = `

        <h1>
            ${assignment[1]}
        </h1>


        <div class="card">

            <p>

                <strong>
                    Course:
                </strong>

                ${course.code}
                —
                ${course.title}

            </p>


            <p>

                <strong>
                    Due Date:
                </strong>

                ${assignment[0]}

            </p>


            <p>

                <strong>
                    Grade:
                </strong>

                ${gradeText}

            </p>


            <hr>


            <h3>
                Assignment Information
            </h3>


            <p>
                Review the course instructions
                and submit your work through
                the assignment area.
            </p>


            <button
                class="open-button"
                onclick="
                    openCourse('${course.code}')
                "
            >
                Back to Course
            </button>

        </div>

    `;

}



/* =====================================================
   LOGIN
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            document.getElementById(
                "loginPage"
            ).style.display = "none";


            document.getElementById(
                "portal"
            ).style.display = "block";


            showPage("dashboard");


            window.scrollTo(
                0,
                0
            );

        }
    );



/* =====================================================
   NAVIGATION BUTTONS
===================================================== */

document
    .querySelectorAll(
        ".navigation button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                showPage(
                    this.dataset.page
                );

            }
        );

    });



/* =====================================================
   LOGOUT
===================================================== */

document
    .getElementById("logoutButton")
    .addEventListener(
        "click",
        function() {

            document.getElementById(
                "portal"
            ).style.display = "none";


            document.getElementById(
                "loginPage"
            ).style.display = "flex";


            document.getElementById(
                "loginForm"
            ).reset();

        }
    );

</script>
