<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f2f5;
    color: #222;
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* =========================
   LOGIN
========================= */

#loginPage {
    min-height: 100vh;
    background: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 450px;
    padding: 40px;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.login-logo {
    text-align: center;
    font-size: 38px;
    font-weight: bold;
    margin-bottom: 35px;
}

.login-logo span {
    color: #f2c744;
}

.login-card h2 {
    margin-bottom: 25px;
}

.login-card label {
    display: block;
    font-weight: bold;
    margin-top: 18px;
    margin-bottom: 7px;
}

.login-card input {
    width: 100%;
    padding: 14px;
    border: 1px solid #bbb;
    border-radius: 7px;
    font-size: 16px;
}

.login-button {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 7px;
    background: #f2c744;
    color: #111;
    font-size: 17px;
    font-weight: bold;
}

/* =========================
   PORTAL
========================= */

#portal {
    display: none;
}

.topbar {
    background: #111;
    color: white;
    min-height: 92px;
    display: flex;
    align-items: center;
    padding: 18px 35px;
    gap: 35px;
}

.logo {
    font-size: 32px;
    font-weight: bold;
    white-space: nowrap;
}

.logo span {
    color: #f2c744;
}

.navigation {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    flex: 1;
}

.nav-button {
    background: transparent;
    color: white;
    border: none;
    padding: 14px 18px;
    border-radius: 10px;
    font-size: 16px;
    white-space: nowrap;
}

.nav-button:hover,
.nav-button.active {
    background: #f2c744;
    color: #111;
}

.logout-button {
    background: #111;
    border: 2px solid #666;
    color: white;
    padding: 13px 22px;
    border-radius: 10px;
    font-size: 16px;
    white-space: nowrap;
}

.logout-button:hover {
    background: #333;
}

.content {
    max-width: 1250px;
    margin: auto;
    padding: 45px 35px;
}

.page-title {
    font-size: 48px;
    margin: 0 0 35px;
}

/* =========================
   GENERAL CARDS
========================= */

.card {
    background: white;
    border-radius: 15px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
}

.notice {
    background: #fff9dc;
    border-left: 10px solid #f2c744;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 40px;
}

.notice h2 {
    margin-top: 0;
}

/* =========================
   COURSES
========================= */

.section-title {
    font-size: 36px;
    margin: 35px 0 25px;
}

.course-card {
    background: white;
    border-radius: 15px;
    border-top: 10px solid #f2c744;
    padding: 35px;
    margin-bottom: 30px;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.course-code {
    font-size: 28px;
    color: #777;
    font-weight: bold;
}

.course-name {
    font-size: 32px;
    font-weight: bold;
    margin: 18px 0 35px;
}

.course-average {
    font-size: 22px;
    margin-bottom: 30px;
}

.open-course {
    background: #111;
    color: white;
    border: none;
    padding: 16px 28px;
    border-radius: 10px;
    font-size: 17px;
}

.open-course:hover {
    background: #333;
}

/* =========================
   TABLES
========================= */

.table-container {
    background: white;
    border-radius: 15px;
    overflow-x: auto;
    box-shadow: 0 2px 8px rgba(0,0,0,.12);
    margin-bottom: 30px;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #111;
    color: white;
    text-align: left;
    padding: 17px;
}

td {
    padding: 17px;
    border-bottom: 1px solid #ddd;
}

tr:last-child td {
    border-bottom: none;
}

.grade-good {
    font-weight: bold;
}

/* =========================
   COURSE PAGE
========================= */

.course-header {
    background: #111;
    color: white;
    border-radius: 15px;
    padding: 35px;
    margin-bottom: 25px;
}

.course-header .course-code {
    color: #f2c744;
}

.course-tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    background: white;
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 25px;
}

.course-tab {
    border: none;
    background: #eee;
    padding: 13px 20px;
    border-radius: 8px;
    white-space: nowrap;
}

.course-tab.active {
    background: #f2c744;
    color: #111;
    font-weight: bold;
}

/* =========================
   PROFILE
========================= */

.profile-card {
    background: white;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.profile-header {
    background: #111;
    color: white;
    padding: 35px;
    display: flex;
    align-items: center;
    gap: 25px;
}

.profile-avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #f2c744;
    color: #111;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 35px;
    font-weight: bold;
}

.profile-header h2 {
    margin: 0;
    font-size: 30px;
}

.profile-header p {
    margin: 7px 0 0;
    color: #ddd;
}

.profile-info {
    padding: 30px;
}

.profile-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 0;
    border-bottom: 1px solid #ddd;
}

.profile-row:last-child {
    border-bottom: none;
}

.profile-label {
    font-weight: bold;
    color: #666;
}

.profile-value {
    text-align: right;
    font-weight: 500;
}

/* =========================
   MESSAGES / DISCUSSIONS
========================= */

.message {
    border-left: 6px solid #f2c744;
    padding: 20px;
    background: #fff;
    border-radius: 8px;
    margin-bottom: 18px;
}

.message h3 {
    margin-top: 0;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    .topbar {
        padding: 18px;
        gap: 18px;
        flex-wrap: wrap;
    }

    .logo {
        font-size: 27px;
    }

    .navigation {
        order: 3;
        width: 100%;
    }

    .logout-button {
        margin-left: auto;
    }

    .content {
        padding: 30px 20px;
    }

    .page-title {
        font-size: 40px;
    }

    .course-name {
        font-size: 27px;
    }

    .profile-header {
        flex-direction: column;
        align-items: flex-start;
    }

    .profile-row {
        flex-direction: column;
    }

    .profile-value {
        text-align: left;
    }
}
</style>
</head>

/* =========================

========================= */

function showPage(page) {

    document.querySelectorAll(".nav-button").forEach(button => {
        button.classList.remove("active");

        if (button.dataset.page === page) {
            button.classList.add("active");
        }
    });

    if (page === "dashboard") {
        showDashboard();
    }

    if (page === "courses") {
        showCourses();
    }

    if (page === "assignments") {
        showAssignments();
    }

    if (page === "grades") {
        showGrades();
    }

                onclick="showCourseGrades()">
                Grades
            </button>

                onclick="showCourseMaterials()">
                Materials
            </button>

            <button class="course-tab"
                onclick="showCourseAnnouncements()">
                Announcements
            </button>

        </div>


        <div class="table-container">

            <table>

                <thead>

                    <tr>
                        <th>Date</th>
                        <th>Assignment</th>
                        <th>Grade</th>
                    </tr>

                </thead>

                <tbody>

    `;


    course.assignments.forEach(assignment => {

        const grade = assignment[2] === null
            ? "Not Graded"
            : assignment[2];

        html += `

            <tr>

                <td>
                    ${assignment[0]}
                </td>

                <td>
                    ${assignment[1]}
                </td>

                <td>
                    ${grade}
                </td>

            </tr>

        `;

    });


    html += `

                </tbody>

            </table>

        </div>

    `;

    document.getElementById("mainContent").innerHTML = html;

}

document.getElementById("loginForm").addEventListener("submit", function(e) {

    e.preventDefault();

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("portal").style.display = "block";

    /*
       THIS IS THE IMPORTANT CHANGE:
       Profile opens immediately after login.
    */

    showPage("profile");

});


/* =========================
   NAVIGATION
========================= */

document.querySelectorAll(".nav-button").forEach(button => {

    button.addEventListener("click", function() {

        showPage(this.dataset.page);

    });

});


/* =========================

========================= */

document.getElementById("logoutButton").addEventListener("click", function() {

    document.getElementById("loginPage").style.display = "flex";

});
