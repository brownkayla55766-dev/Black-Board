<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f5f5;
  color: #222;
}

button {
  font: inherit;
  cursor: pointer;
}

/* LOGIN */

.login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #111;
  padding: 20px;
}

.login-card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 12px;
  padding: 32px;
  box-shadow: 0 15px 40px #0005;
}

.logo {
  font-weight: 800;
  font-size: 27px;
  color: #111;
  margin-bottom: 5px;
}

.gold {
  color: #f2c300;
}

.subtitle {
  color: #666;
  margin: 0 0 25px;
}

label {
  display: block;
  font-weight: 700;
  margin: 14px 0 7px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #bbb;
  border-radius: 7px;
  font-size: 16px;
}

.login-btn {
  width: 100%;
  margin-top: 22px;
  padding: 14px;
  background: #f2c300;
  border: 0;
  border-radius: 7px;
  font-weight: 800;
}

/* APP */

.app {
  display: none;
  min-height: 100vh;
}

.top {
  min-height: 62px;
  background: #111;
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.brand {
  font-weight: 800;
  font-size: 20px;
}

.menu {
  display: flex;
  gap: 6px;
  overflow-x: auto;
}

.menu button {
  background: transparent;
  color: white;
  border: 0;
  padding: 10px 12px;
  border-radius: 6px;
  white-space: nowrap;
}

.menu button:hover,
.menu button.active {
  background: #f2c300;
  color: #111;
}

.logout {
  border: 1px solid #777;
  background: #222;
  color: white;
  padding: 8px 12px;
  border-radius: 6px;
}

.wrap {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

h1 {
  margin-top: 0;
}

.grid {
  display: grid;
  grid-template-columns: repeat(
    auto-fit,
    minmax(250px, 1fr)
  );
  gap: 18px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 10px #00000012;
  border: 1px solid #ddd;
}

.course-card {
  border-top: 5px solid #f2c300;
}

.course-card h3 {
  margin: 4px 0;
}

.course-card p {
  color: #666;
}

.open {
  background: #111;
  color: white;
  border: 0;
  padding: 10px 14px;
  border-radius: 6px;
}

.stat {
  font-size: 28px;
  font-weight: 800;
}

.muted {
  color: #777;
}

.table-wrap {
  overflow-x: auto;
  background: white;
  border-radius: 10px;
  border: 1px solid #ddd;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  padding: 13px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #111;
  color: white;
}

.grade {
  font-weight: 800;
}

.pending {
  color: #777;
}

.tabs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin: 15px 0;
}

.tabs button {
  border: 1px solid #ccc;
  background: white;
  padding: 9px 13px;
  border-radius: 6px;
}

.tabs button.active {
  background: #f2c300;
  border-color: #f2c300;
  font-weight: 700;
}

.item {
  padding: 14px 0;
  border-bottom: 1px solid #eee;
}

.notice {
  background: #fff8d8;
  border-left: 5px solid #f2c300;
  padding: 14px;
  border-radius: 6px;
  margin-bottom: 18px;
}

a {
  color: #111;
  font-weight: 700;
}

/* MOBILE */

@media (max-width: 800px) {

  .top {
    align-items: flex-start;
    gap: 10px;
    padding: 12px;
    flex-wrap: wrap;
  }

  .menu {
    order: 3;
    width: 100%;
  }

  .wrap {
    padding: 16px;
  }

}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<section id="login" class="login">

  <div class="login-card">

    <div class="logo">
      Student <span class="gold">Portal</span>
    </div>

    <p class="subtitle">
      Sign in to continue
    </p>

    <form id="loginForm">

      <label>
        Username
      </label>

      <input
        id="username"
        type="text"
        required
      >

      <label>
        Password
      </label>

      <input
        id="password"
        type="password"
        required
      >

      <button
        class="login-btn"
        type="submit"
      >
        Login
      </button>

    </form>

  </div>

</section>


<!-- MAIN PORTAL -->

<section id="app" class="app">

  <header class="top">

    <div class="brand">
      Student <span class="gold">Portal</span>
    </div>

    <nav class="menu">

      <button data-page="dashboard">
        Dashboard
      </button>

      <button data-page="courses">
        Courses
      </button>

      <button data-page="assignments">
        Assignments
      </button>

      <button data-page="grades">
        Grades
      </button>

      <button data-page="calendar">
        Calendar
      </button>

      <button data-page="messages">
        Messages
      </button>

      <button data-page="discussions">
        Discussions
      </button>

      <button data-page="profile">
        Profile
      </button>

    </nav>

    <button id="logout" class="logout">
      Log out
    </button>

  </header>

  <main
    id="content"
    class="wrap"
  ></main>

</section>

/* =========================
   PAGE NAVIGATION
========================= */

function showPage(page) {

  document
    .querySelectorAll(".menu button")
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.page === page
      );

    });


  const content =
    document.getElementById("content");


  if (page === "dashboard") {
    dashboard(content);
  }

  else if (page === "courses") {
    coursesPage(content);
  }

  else if (page === "assignments") {
    assignmentsPage(content);
  }

  else if (page === "grades") {
    gradesPage(content);
  }

  else if (page === "calendar") {
    calendarPage(content);
  }

  else if (page === "messages") {
    simplePage(
      content,
      "Messages",
      [
        "Professor Smith: Your research proposal instructions are posted.",
        "Advising: Registration information is available."
      ]
    );
  }

  else if (page === "discussions") {
    simplePage(
      content,
      "Discussions",
      [
        "Week 6 discussion: Constitutional interpretation",
        "Psychology II discussion: Emotion and behavior",
        "English Composition II: Research topics"
      ]
    );
  }

  else if (page === "profile") {
    profilePage(content);
  }

}

/* =========================
   ASSIGNMENT DETAILS
========================= */

function assignmentDetail(
  code,
  name
) {

  const course =
    courses.find(
      course => course.name === code
    );


  const assignment =
    course.assignments.find(
      item => item[1] === name
    );


  document.getElementById(
    "content"
  ).innerHTML = `

    <h1>
      ${assignment[1]}
    </h1>


    <div class="card">

      <p>

        <b>
          Course:
        </b>

        ${course.name}
        —
        ${course.title}

      </p>


      <p>

        <b>
          Due:
        </b>

        ${assignment[0]}

      </p>


      <p>

        <b>
          Grade:
        </b>

        ${
          assignment[2] === null
            ? "Not Graded"
            : assignment[2] + "%"
        }

      </p>


      <hr>


      <h3>
        Assignment Information
      </h3>


      <p>
        Review the course instructions
        and submit your work through
        the assignment area.
      </p>


      <button
        class="open"
        onclick="openCourse('${course.name}')"
      >
        Back to Course
      </button>

    </div>

  `;

}


/* =========================
   LOGIN
========================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      document.getElementById(
        "login"
      ).style.display = "none";


      document.getElementById(
        "app"
      ).style.display = "block";


      showPage("dashboard");


      window.scrollTo(0, 0);

    }
  );


/* =========================
   MENU BUTTONS
========================= */

document
  .querySelectorAll(".menu button")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        showPage(
          button.dataset.page
        );

      }
    );

  });


/* =========================
   LOGOUT
========================= */

document
  .getElementById("logout")
  .addEventListener(
    "click",
    () => {

      document.getElementById(
        "app"
      ).style.display = "none";


      document.getElementById(
        "login"
      ).style.display = "flex";


      document
        .getElementById("loginForm")
        .reset();

    }
  );

</script>

</body>
</html>
