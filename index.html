<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blackboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #222;
}

button {
    font-family: Arial, Helvetica, sans-serif;
    cursor: pointer;
}

/* LOGIN */

#loginPage {
    min-height: 100vh;
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 430px;
    background: white;
    padding: 35px;
    border-radius: 12px;
    box-shadow: 0 15px 45px rgba(0,0,0,.35);
}

.login-logo {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 8px;
}

.yellow {
    color: #f4c400;
}

.login-subtitle {
    color: #666;
    margin-bottom: 28px;
}

.login-box label {
    display: block;
    font-weight: bold;
    margin-top: 17px;
    margin-bottom: 7px;
}

.login-box input {
    width: 100%;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 6px;
    font-size: 16px;
}

.login-button {
    width: 100%;
    margin-top: 24px;
    padding: 14px;
    background: #f4c400;
    border: none;
    border-radius: 7px;
    font-size: 16px;
    font-weight: bold;
}

/* PORTAL */

#portal {
    display: none;
    min-height: 100vh;
}

.topbar {
    background: #111;
    color: white;
    min-height: 64px;
    display: flex;
    align-items: center;
    padding: 10px 18px;
    gap: 20px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 21px;
    font-weight: bold;
    white-space: nowrap;
}

.navigation {
    display: flex;
    gap: 5px;
    flex: 1;
    overflow-x: auto;
}

.navigation button {
    background: transparent;
    color: white;
    border: none;
    padding: 10px 12px;
    border-radius: 5px;
    white-space: nowrap;
}

.navigation button:hover,
.navigation button.active {
    background: #f4c400;
    color: #111;
}

.logout-button {
    background: #222;
    color: white;
    border: 1px solid #666;
    border-radius: 6px;
    padding: 9px 13px;
    white-space: nowrap;
}

/* MAIN */

#pageContent {
    max-width: 1200px;
    margin: auto;
    padding: 25px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(
        auto-fit,
        minmax(250px, 1fr)
    );
    gap: 18px;
}

.card {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.course-card {
    border-top: 5px solid #f4c400;
}

.course-code {
    color: #777;
    font-weight: bold;
}

.muted {
    color: #777;
}

.open-button {
    background: #111;
    color: white;
    border: none;
    border-radius: 6px;
    padding: 10px 15px;
    margin-top: 8px;
}

.notice {
    background: #fff8d6;
    border-left: 5px solid #f4c400;
    padding: 15px;
    border-radius: 6px;
    margin-bottom: 20px;
}

/* TABLES */

.table-container {
    background: white;
    border: 1px solid #ddd;
    border-radius: 10px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #111;
    color: white;
    padding: 14px;
    text-align: left;
}

td {
    padding: 14px;
    border-bottom: 1px solid #eee;
}

.grade {
    font-weight: bold;
}

.not-graded {
    color: #777;
}

/* COURSE TABS */

.course-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 18px 0;
}

.course-tabs button {
    background: white;
    border: 1px solid #ccc;
    padding: 9px 13px;
    border-radius: 6px;
}

.course-tabs button.active {
    background: #f4c400;
    border-color: #f4c400;
    font-weight: bold;
}

/* LIST */

.list-item {
    padding: 15px 0;
    border-bottom: 1px solid #eee;
}

/* PROFILE */

.profile-card {
    max-width: 700px;
}

.profile-header {
    display: flex;
    align-items: center;
    gap: 18px;
    padding-bottom: 20px;
    border-bottom: 1px solid #ddd;
    margin-bottom: 20px;
}

.profile-avatar {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #111;
    color: #f4c400;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
}

.profile-info {
    display: grid;
    grid-template-columns: 180px 1fr;
}

.profile-info div {
    padding: 14px 5px;
    border-bottom: 1px solid #eee;
}

.profile-label {
    font-weight: bold;
    color: #666;
}

/* MOBILE */

@media(max-width:800px) {

    .topbar {
        flex-wrap: wrap;
        align-items: flex-start;
    }

    .navigation {
        width: 100%;
        order: 3;
    }

    #pageContent {
        padding: 16px;
    }

    .profile-info {
        grid-template-columns: 1fr;
    }

}
</style>
</head>

function showPage(page) {

document
.querySelectorAll(".navigation button")
.forEach(button => {

button.classList.toggle(
"active",
button.dataset.page === page
);

});
